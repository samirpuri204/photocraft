<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#262626">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Pixelune</title>
  <link data-trunk rel="rust" data-bin="photocraft-web-boot" data-cargo-profile="wasm-release" data-wasm-opt="z" data-wasm-opt-params="--converge" data-weak-refs />
  <style>
    /* The canvas is the whole page: no page scrolling, no rubber-banding, no double-tap zoom,
       and no browser gesture stealing a drag that belongs to the brush. */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #262626;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    /* 100dvh follows the mobile URL bar, so the bottom of the editor is never under it. */
    @supports (height: 100dvh) { html, body { height: 100dvh; } }
    #photocraft_canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      touch-action: none;
      outline: none;
    }
    #photocraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    #photocraft_loading p { margin: 0 0 8px; max-width: 420px; line-height: 1.5; }
    #photocraft_loading a { color: #e0e0e0; pointer-events: auto; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #photocraft_stalled { color: #8c8c8c; visibility: hidden; animation: photocraft-stalled 0s 20s forwards; }
    @keyframes photocraft-stalled { to { visibility: visible; } }

    /* A portrait phone shows a hint to turn the device: the editor's tools need width. It sits on
       the bottom edge, never blocks the canvas, and disappears for good once dismissed. */
    #pixelune_rotate { display: none; }
    @media (max-width: 699px) and (orientation: portrait) {
      #pixelune_rotate {
        display: flex; position: fixed; left: 8px; right: 8px; bottom: 64px; z-index: 20;
        align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px;
        background: rgba(32, 32, 32, 0.94); border: 1px solid #3a3a3a; color: #e6e6e6;
        font: 12px/1.35 system-ui, -apple-system, sans-serif;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
      }
      #pixelune_rotate .grow { flex: 1; }
      #pixelune_rotate label {
        flex: none; padding: 5px 10px; border-radius: 7px; background: #3a3a3a; color: #fff;
        cursor: pointer; touch-action: manipulation;
      }
      #rotate-off:checked ~ #pixelune_rotate { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="photocraft_canvas"></canvas>
  <input type="checkbox" id="rotate-off" hidden>
  <div id="pixelune_rotate">
    <span class="grow">Turn the device sideways for the full editor.</span>
    <label for="rotate-off">Keep portrait</label>
  </div>
  <div id="photocraft_loading">
    <p>Loading Pixelune&hellip;</p>
    <p id="photocraft_stalled">This is taking longer than usual. If Pixelune doesn't start, its files may have failed to
      download or come from a different version of this page. <a href="">Reload</a> to try again; the browser
      console lists what failed.</p>
  </div>
</body>
</html>
